<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E✨%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#F5F6F8;--panel:#FFFFFF;--ink:#1C2433;--muted:#69758A;--line:#E1E5EC;
  --accent:#3552D6;--accent-ink:#FFFFFF;--tint:#E9EDFD;--code:#F0F2F6;--danger:#B42318;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#10131A;--panel:#171B24;--ink:#E7EAF1;--muted:#9099AB;--line:#2A303D;
    --accent:#7F95F4;--accent-ink:#10131A;--tint:#222A44;--code:#1E232E;--danger:#F97066;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.65 -apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);height:100dvh}

/* sidebar */
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:10px;padding:14px;min-height:0}
.brand{font-weight:700;font-size:17px;letter-spacing:.02em;padding:2px 4px 6px}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px;margin:0 -4px;padding:0 4px}
.item{display:flex;align-items:center;gap:6px;border-radius:8px;padding:0 4px 0 10px;min-height:40px}
.item:hover{background:var(--bg)}
.item.on{background:var(--tint)}
.item .t{flex:1;min-width:0;background:none;border:0;text-align:left;padding:8px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tag{font-size:12px;color:var(--muted)}
.item .x{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:6px;font-size:18px;line-height:1}
.item .x:hover{color:var(--danger)}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;min-height:42px;padding:0 18px;font-weight:600}
.primary:disabled{opacity:.5;cursor:default}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;min-height:40px;padding:0 14px}
.ghost:hover{background:var(--bg)}

/* main */
main{display:flex;flex-direction:column;min-width:0;min-height:0}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
#menu{display:none;border:1px solid var(--line);background:none;border-radius:8px;width:40px;height:40px;font-size:18px}
.tabs{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;border-radius:8px;min-height:34px;padding:0 16px}
.tabs button[aria-selected=true]{background:var(--panel);box-shadow:0 0 0 1px var(--line);font-weight:600}
header select{margin-left:auto;max-width:280px;min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:0 10px}
.view{flex:1;display:flex;flex-direction:column;min-height:0}
.view[hidden]{display:none}

/* chat */
#msgs{flex:1;overflow:auto;padding:22px 16px 10px}
.col{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.msg.user{align-self:flex-end;max-width:85%;background:var(--tint);border-radius:14px 14px 4px 14px;padding:9px 14px;overflow-wrap:anywhere}
.msg.assistant{overflow-wrap:anywhere}
.msg .body>*:first-child{margin-top:0}.msg .body>*:last-child{margin-bottom:0}
.msg p{margin:.6em 0}
.msg h2,.msg h3,.msg h4,.msg h5{margin:1em 0 .4em;line-height:1.35}
.msg ul,.msg ol{margin:.5em 0;padding-left:1.5em}
.msg a{color:var(--accent)}
.msg code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em;background:var(--code);padding:.1em .35em;border-radius:5px}
.code{margin:.8em 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--code)}
.code-h{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 4px 12px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.copy{border:0;background:none;color:var(--muted);border-radius:6px;min-height:30px;padding:0 10px}
.copy:hover{background:var(--panel);color:var(--ink)}
.code pre{margin:0;padding:12px 14px;overflow:auto}
.code pre code{background:none;padding:0;font-size:13.5px;line-height:1.6}
details.think{margin:.6em 0;color:var(--muted);border-left:3px solid var(--line);padding:2px 0 2px 12px}
details.think summary{cursor:pointer}
.dots{color:var(--muted)}
.empty{margin:8vh auto 0;max-width:560px;text-align:center}
.empty h1{font-size:24px;margin:0 0 6px}
.empty p{color:var(--muted);margin:0 0 20px}
.sugg{display:flex;flex-direction:column;gap:8px}
.sugg button{border:1px solid var(--line);background:var(--panel);border-radius:10px;min-height:44px;padding:8px 14px;text-align:left}
.sugg button:hover{border-color:var(--accent)}
.composer{padding:8px 16px 16px}
.composer .box{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.composer textarea{flex:1;border:0;background:none;resize:none;max-height:200px;padding:6px 8px;outline:none}
.composer .box:focus-within{border-color:var(--accent)}
.hint{max-width:820px;margin:6px auto 0;font-size:12px;color:var(--muted)}

/* image */
#imgView{overflow:auto}
.img-wrap{max-width:980px;width:100%;margin:0 auto;padding:20px 16px 28px;display:flex;flex-direction:column;gap:16px}
.img-ctl{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.img-ctl textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;resize:vertical;min-height:84px}
.row{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end}
.row label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.row select{min-height:38px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 8px;color:var(--ink)}
.row select:disabled{opacity:.5}
.row .chk{flex-direction:row;align-items:center;gap:6px;color:var(--ink);min-height:38px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;display:block;background:var(--code);aspect-ratio:1/1;object-fit:cover}
.card .ph{aspect-ratio:1/1;display:grid;place-items:center;color:var(--muted);background:var(--code)}
.card .meta{padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.card .meta p{margin:0;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .meta a,.card .meta .err{font-size:13px}
.card .meta a{color:var(--accent)}
.err{color:var(--danger)}
.note{color:var(--muted);font-size:13px;margin:0}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:20px;width:min(460px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h2{margin:0 0 12px;font-size:18px}
dialog label{display:flex;flex-direction:column;gap:4px;margin:12px 0;font-size:13px;color:var(--muted)}
dialog input[type=password],dialog input[type=text],dialog textarea{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px;color:var(--ink)}
dialog .foot{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.danger{color:var(--danger)}

@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:80%;max-width:310px;z-index:20;transform:translateX(-102%);transition:transform .2s;padding-top:calc(14px + env(safe-area-inset-top,0))}
  aside.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  #menu{display:block}
  header{padding:8px 10px;gap:6px}
  .tabs button{padding:0 11px}
  header select{max-width:42vw}
}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand">AI 工作台</div>
    <button id="new" class="primary" type="button">新对话</button>
    <nav id="list" aria-label="历史对话"></nav>
    <button id="openSettings" class="ghost" type="button">设置</button>
  </aside>

  <main>
    <header>
      <button id="menu" type="button" aria-label="打开菜单">☰</button>
      <div class="tabs" role="tablist" id="tabs">
        <button role="tab" data-mode="chat" type="button">对话</button>
        <button role="tab" data-mode="code" type="button">编程</button>
        <button role="tab" data-mode="image" type="button">绘图</button>
      </div>
      <select id="model" aria-label="选择模型"></select>
    </header>

    <section id="chatView" class="view">
      <div id="msgs"><div class="col" id="col"></div></div>
      <div class="composer">
        <div class="box">
          <textarea id="input" rows="1" placeholder="输入内容，Enter 发送，Shift+Enter 换行"></textarea>
          <button id="send" class="primary" type="button">发送</button>
        </div>
        <div class="hint" id="hint"></div>
      </div>
    </section>

    <section id="imgView" class="view" hidden>
      <div class="img-wrap">
        <div class="img-ctl">
          <textarea id="ip" placeholder="描述你想要的画面，例如：清晨薄雾里的山间茶园，柔和的侧逆光，胶片质感"></textarea>
          <div class="row">
            <label>模型<select id="im"></select></label>
            <label>尺寸<select id="isz">
              <option value="1024x1024">1024 × 1024</option>
              <option value="768x1024">768 × 1024（竖）</option>
              <option value="1024x768">1024 × 768（横）</option>
              <option value="512x512">512 × 512</option>
            </select></label>
            <label>步数：<span id="stv"></span><input id="ist" type="range" min="1" max="20" value="4"></label>
            <label class="chk"><input id="itr" type="checkbox" checked>中文提示词自动译成英文</label>
          </div>
          <div class="row">
            <button id="gen" class="primary" type="button">生成图片</button>
            <p class="note" id="inote"></p>
          </div>
        </div>
        <div class="gal" id="gal"></div>
      </div>
    </section>
  </main>
</div>

<dialog id="dlg">
  <form method="dialog" id="sform">
    <h2>设置</h2>
    <label>访问密码（如果站点设置了 ACCESS_PASSWORD）
      <input id="spw" type="password" autocomplete="off">
    </label>
    <label>随机性：<span id="stempv"></span>
      <input id="stemp" type="range" min="0" max="1.5" step="0.1">
    </label>
    <label>额外模型 ID（每行一个，会出现在模型下拉里）
      <textarea id="sextra" rows="3" placeholder="@cf/meta/llama-4-scout-17b-16e-instruct"></textarea>
    </label>
    <div class="foot">
      <button class="ghost danger" type="button" id="clearAll">清空所有对话</button>
      <button class="primary" value="ok">完成</button>
    </div>
  </form>
</dialog>

<script>
/* ===== 模型列表：模型下线或新增时，改这里即可 ===== */
const CHAT_MODELS = [
  ['@cf/meta/llama-3.3-70b-instruct-fp8-fast', 'Llama 3.3 70B（通用）'],
  ['@cf/qwen/qwen2.5-coder-32b-instruct', 'Qwen2.5 Coder 32B（编程）'],
  ['@cf/deepseek-ai/deepseek-r1-distill-qwen-32b', 'DeepSeek R1 蒸馏 32B（推理）'],
  ['@cf/google/gemma-3-12b-it', 'Gemma 3 12B'],
  ['@cf/mistralai/mistral-small-3.1-24b-instruct', 'Mistral Small 3.1 24B'],
  ['@cf/meta/llama-3.1-8b-instruct', 'Llama 3.1 8B（快）'],
];
const IMG_MODELS = [
  ['@cf/black-forest-labs/flux-1-schnell', 'FLUX.1 schnell（推荐）', 4],
  ['@cf/stabilityai/stable-diffusion-xl-base-1.0', 'Stable Diffusion XL', 20],
  ['@cf/bytedance/stable-diffusion-xl-lightning', 'SDXL Lightning（快）', 4],
  ['@cf/lykon/dreamshaper-8-lcm', 'DreamShaper 8 LCM', 8],
];
const DEFAULT_MODEL = { chat: CHAT_MODELS[0][0], code: CHAT_MODELS[1][0] };
const SYSTEM = {
  chat: '你是一个乐于助人的助手。默认使用用户提问所用的语言回答，表述清楚、直接。',
  code: '你是资深软件工程师。先给出完整、可运行的代码，再简要说明关键点。代码一律放在带语言标注的 Markdown 代码块里。除非用户使用其他语言，否则用中文回答。',
};
const SUGGEST = {
  chat: ['用三句话解释什么是 Cloudflare Workers', '帮我写一封礼貌的请假邮件，理由是身体不适'],
  code: ['用 Python 写一个带重试和并发限制的异步文件下载器', '解释这个正则：^(?=.*\\d)(?=.*[a-z]).{8,}$'],
};

/* ===== 状态 ===== */
const $ = (s) => document.querySelector(s);
const LS = 'cfai.v1';
let store;
try { store = JSON.parse(localStorage.getItem(LS)) || {}; } catch { store = {}; }
store.convs = store.convs || [];
store.mode = store.mode || 'chat';
store.settings = Object.assign({ password: '', temp: 0.7, extra: '' }, store.settings);
const save = () => { try { localStorage.setItem(LS, JSON.stringify(store)); } catch {} };
const uid = () => Math.random().toString(36).slice(2, 10);
let busy = false, ctrl = null, gBusy = false;

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const chatModels = () => {
  const extra = store.settings.extra.split('\n').map((s) => s.trim()).filter(Boolean).map((id) => [id, id]);
  return [...CHAT_MODELS, ...extra];
};
const cur = () => store.convs.find((c) => c.id === store.active);

/* ===== Markdown（轻量，无外部依赖） ===== */
function md(src) {
  const hold = [];
  const keep = (h) => { hold.push(h); return '\u0000' + (hold.length - 1) + '\u0000'; };
  src = src.replace(/<think>([\s\S]*?)(?:<\/think>|$)/g, (m, t) =>
    keep('<details class="think"><summary>思考过程</summary><div>' + esc(t.trim()).replace(/\n/g, '<br>') + '</div></details>'));
  src = src.replace(/```([\w+#.-]*)[^\S\n]*\n?([\s\S]*?)(?:```|$)/g, (m, l, c) =>
    keep('<div class="code"><div class="code-h"><span>' + esc(l || 'text') + '</span><button class="copy" type="button">复制</button></div><pre><code>' + esc(c.replace(/\n$/, '')) + '</code></pre></div>'));
  let h = esc(src);
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>')
       .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
       .replace(/(^|[^*])\*([^*\s][^*\n]*)\*/g, '$1<em>$2</em>')
       .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  const out = []; let list = null, para = [];
  const fp = () => { if (para.length) { out.push('<p>' + para.join('<br>') + '</p>'); para = []; } };
  const fl = () => { if (list) { out.push('</' + list + '>'); list = null; } };
  for (const ln of h.split('\n')) {
    let m;
    if (/^\u0000\d+\u0000$/.test(ln.trim())) { fp(); fl(); out.push(ln.trim()); }
    else if ((m = ln.match(/^(#{1,4})\s+(.*)$/))) { fp(); fl(); const n = m[1].length + 1; out.push('<h' + n + '>' + m[2] + '</h' + n + '>'); }
    else if ((m = ln.match(/^\s*[-*]\s+(.*)$/))) { fp(); if (list !== 'ul') { fl(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + m[1] + '</li>'); }
    else if ((m = ln.match(/^\s*\d+[.)]\s+(.*)$/))) { fp(); if (list !== 'ol') { fl(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + m[1] + '</li>'); }
    else if (!ln.trim()) { fp(); fl(); }
    else { fl(); para.push(ln); }
  }
  fp(); fl();
  return out.join('').replace(/\u0000(\d+)\u0000/g, (_, i) => hold[i]);
}

/* ===== 会话 ===== */
function newConv(mode) {
  const c = { id: uid(), title: '新对话', mode, model: DEFAULT_MODEL[mode], messages: [], t: Date.now() };
  store.convs.unshift(c); store.active = c.id; save(); return c;
}
function switchMode(mode) {
  store.mode = mode;
  if (mode !== 'image') {
    let c = cur();
    if (!c || c.mode !== mode) {
      c = store.convs.find((x) => x.mode === mode) || newConv(mode);
      store.active = c.id;
    }
  }
  save(); renderAll();
}
function renderTabs() {
  document.querySelectorAll('#tabs button').forEach((b) =>
    b.setAttribute('aria-selected', String(b.dataset.mode === store.mode)));
}
function renderList() {
  const tag = { chat: '对话', code: '编程' };
  $('#list').innerHTML = store.convs.map((c) =>
    '<div class="item' + (c.id === store.active && store.mode !== 'image' ? ' on' : '') + '" data-id="' + c.id + '">' +
    '<button class="t" type="button" title="' + esc(c.title) + '">' + esc(c.title) + '</button>' +
    '<span class="tag">' + tag[c.mode] + '</span>' +
    '<button class="x" type="button" aria-label="删除对话">×</button></div>').join('') ||
    '<p class="note" style="padding:6px 4px">还没有对话</p>';
}
function renderModelSelect() {
  const c = cur(); const sel = $('#model');
  if (!c) return;
  const list = chatModels();
  if (!list.some((m) => m[0] === c.model)) list.push([c.model, c.model]);
  sel.innerHTML = list.map((m) => '<option value="' + esc(m[0]) + '"' + (m[0] === c.model ? ' selected' : '') + '>' + esc(m[1]) + '</option>').join('');
}
function msgHtml(m) {
  return '<div class="msg ' + m.role + '"><div class="body">' +
    (m.role === 'user' ? esc(m.content).replace(/\n/g, '<br>') : (md(m.content) || '<span class="dots">生成中…</span>')) +
    '</div></div>';
}
function renderMsgs() {
  const c = cur(); const col = $('#col');
  if (!c) return;
  if (!c.messages.length) {
    const code = c.mode === 'code';
    col.innerHTML = '<div class="empty"><h1>' + (code ? '写代码、查 Bug、读代码' : '想聊点什么？') + '</h1><p>' +
      (code ? '默认使用 Qwen2.5 Coder，也可以在右上角换模型。' : '右上角可以切换模型，对话记录只保存在这台设备上。') +
      '</p><div class="sugg">' + SUGGEST[c.mode].map((s) => '<button type="button" data-s="' + esc(s) + '">' + esc(s) + '</button>').join('') + '</div></div>';
    return;
  }
  col.innerHTML = c.messages.map(msgHtml).join('');
  const box = $('#msgs'); box.scrollTop = box.scrollHeight;
}
let raf = 0;
function paintLast() {
  if (raf) return;
  raf = requestAnimationFrame(() => {
    raf = 0;
    const c = cur(); const last = $('#col').lastElementChild;
    if (!c || !last) return;
    const box = $('#msgs');
    const stick = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    last.querySelector('.body').innerHTML = md(c.messages[c.messages.length - 1].content) || '<span class="dots">生成中…</span>';
    if (stick) box.scrollTop = box.scrollHeight;
  });
}
function renderAll() {
  renderTabs(); renderList();
  const img = store.mode === 'image';
  $('#chatView').hidden = img; $('#imgView').hidden = !img; $('#model').hidden = img;
  if (!img) { renderModelSelect(); renderMsgs(); $('#hint').textContent = busy ? '' : '内容由 AI 生成，请注意核对。'; }
  $('#send').textContent = busy ? '停止' : '发送';
  $('#side').classList.remove('open');
}

/* ===== 对话请求 ===== */
const headers = () => {
  const h = { 'content-type': 'application/json' };
  if (store.settings.password) h['x-access-password'] = encodeURIComponent(store.settings.password);
  return h;
};
async function errText(res) {
  let t = '';
  try { t = await res.text(); } catch {}
  try { const j = JSON.parse(t); if (j.error) t = j.error; } catch {}
  if (res.status === 401) $('#dlg').showModal();
  return (t || '').slice(0, 400) || ('请求失败（' + res.status + '）');
}
async function send() {
  if (busy) { ctrl && ctrl.abort(); return; }
  const text = $('#input').value.trim();
  const c = cur();
  if (!text || !c) return;
  c.messages.push({ role: 'user', content: text });
  if (c.messages.length === 1) c.title = text.slice(0, 28);
  const a = { role: 'assistant', content: '' };
  c.messages.push(a);
  $('#input').value = ''; autosize();
  busy = true; ctrl = new AbortController(); renderAll();
  try {
    const res = await fetch('/api/chat', {
      method: 'POST', headers: headers(), signal: ctrl.signal,
      body: JSON.stringify({
        model: c.model,
        temperature: store.settings.temp,
        messages: [{ role: 'system', content: SYSTEM[c.mode] }, ...c.messages.slice(0, -1).map(({ role, content }) => ({ role, content }))],
      }),
    });
    if (!res.ok) throw new Error(await errText(res));
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const ln of lines) {
        if (!ln.startsWith('data:')) continue;
        const d = ln.slice(5).trim();
        if (!d || d === '[DONE]') continue;
        try {
          const j = JSON.parse(d);
          const piece = typeof j.response === 'string' ? j.response : (j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content) || '';
          if (piece) { a.content += piece; paintLast(); }
        } catch {}
      }
    }
    if (!a.content) a.content = '（模型没有返回内容，换个模型或稍后再试）';
  } catch (e) {
    if (e.name !== 'AbortError') a.content += (a.content ? '\n\n' : '') + '⚠️ ' + e.message;
    else if (!a.content) a.content = '（已停止）';
  } finally {
    busy = false; ctrl = null; save(); renderAll();
  }
}
function autosize() {
  const t = $('#input'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 200) + 'px';
}

/* ===== 绘图 ===== */
function renderImgControls() {
  $('#im').innerHTML = IMG_MODELS.map((m) => '<option value="' + m[0] + '">' + esc(m[1]) + '</option>').join('');
  onImgModel();
}
function onImgModel() {
  const m = IMG_MODELS.find((x) => x[0] === $('#im').value);
  const flux = m[0].includes('flux');
  $('#ist').max = flux ? 8 : 20; $('#ist').value = m[2]; $('#stv').textContent = m[2];
  $('#isz').disabled = flux;
  $('#inote').textContent = flux ? 'FLUX 使用固定尺寸；生成的图片只保留在当前页面，记得及时下载。' : '生成的图片只保留在当前页面，记得及时下载。';
}
async function gen() {
  const prompt = $('#ip').value.trim();
  if (!prompt || gBusy) return;
  gBusy = true; $('#gen').disabled = true; $('#gen').textContent = '生成中…';
  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = '<div class="ph">正在绘制…</div><div class="meta"><p>' + esc(prompt) + '</p></div>';
  $('#gal').prepend(card);
  const [w, h] = $('#isz').value.split('x').map(Number);
  try {
    const res = await fetch('/api/image', {
      method: 'POST', headers: headers(),
      body: JSON.stringify({ prompt, model: $('#im').value, steps: +$('#ist').value, width: w, height: h, translate: $('#itr').checked }),
    });
    if (!res.ok) throw new Error(await errText(res));
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    let fp = prompt;
    try { fp = decodeURIComponent(res.headers.get('x-final-prompt') || prompt); } catch {}
    const ext = blob.type.includes('png') ? 'png' : 'jpg';
    card.innerHTML = '<img alt="" src="' + url + '"><div class="meta"><p title="' + esc(fp) + '">' + esc(fp) + '</p><a href="' + url + '" download="ai-' + Date.now() + '.' + ext + '">下载图片</a></div>';
    card.querySelector('img').alt = fp;
  } catch (e) {
    card.innerHTML = '<div class="ph err">生成失败</div><div class="meta"><p class="err">' + esc(e.message) + '</p><p>' + esc(prompt) + '</p></div>';
  } finally {
    gBusy = false; $('#gen').disabled = false; $('#gen').textContent = '生成图片';
  }
}

/* ===== 事件 ===== */
$('#tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) switchMode(b.dataset.mode); });
$('#new').addEventListener('click', () => {
  const mode = store.mode === 'image' ? 'chat' : store.mode;
  if (store.mode === 'image') store.mode = mode;
  const c = cur();
  if (c && c.mode === mode && !c.messages.length) { renderAll(); return; }
  newConv(mode); renderAll(); $('#input').focus();
});
$('#list').addEventListener('click', (e) => {
  const it = e.target.closest('.item'); if (!it) return;
  const id = it.dataset.id;
  if (e.target.closest('.x')) {
    if (busy) return;
    store.convs = store.convs.filter((c) => c.id !== id);
    if (store.active === id) {
      const n = store.convs.find((c) => c.mode === store.mode && store.mode !== 'image') || store.convs[0];
      if (n) { store.active = n.id; store.mode = n.mode; } else { store.active = null; newConv(store.mode === 'image' ? 'chat' : store.mode); store.mode = cur().mode; }
    }
    save(); renderAll(); return;
  }
  const c = store.convs.find((x) => x.id === id);
  if (c) { store.active = id; store.mode = c.mode; save(); renderAll(); }
});
$('#model').addEventListener('change', (e) => { const c = cur(); if (c) { c.model = e.target.value; save(); } });
$('#send').addEventListener('click', send);
$('#input').addEventListener('input', autosize);
$('#input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); send(); }
});
$('#col').addEventListener('click', (e) => {
  const cp = e.target.closest('.copy');
  if (cp) {
    const code = cp.closest('.code').querySelector('code').textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(
      () => { cp.textContent = '已复制'; setTimeout(() => (cp.textContent = '复制'), 1400); },
      () => { cp.textContent = '复制失败'; setTimeout(() => (cp.textContent = '复制'), 1400); });
    return;
  }
  const s = e.target.closest('[data-s]');
  if (s) { $('#input').value = s.dataset.s; send(); }
});
$('#menu').addEventListener('click', () => $('#side').classList.toggle('open'));
document.querySelector('main').addEventListener('click', () => $('#side').classList.remove('open'));
$('#im').addEventListener('change', onImgModel);
$('#ist').addEventListener('input', (e) => ($('#stv').textContent = e.target.value));
$('#gen').addEventListener('click', gen);
$('#ip').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); gen(); }
});

/* 设置 */
$('#openSettings').addEventListener('click', () => {
  $('#spw').value = store.settings.password;
  $('#stemp').value = store.settings.temp; $('#stempv').textContent = store.settings.temp;
  $('#sextra').value = store.settings.extra;
  $('#dlg').showModal();
});
$('#stemp').addEventListener('input', (e) => ($('#stempv').textContent = e.target.value));
$('#dlg').addEventListener('close', () => {
  store.settings.password = $('#spw').value;
  store.settings.temp = +$('#stemp').value || 0;
  store.settings.extra = $('#sextra').value;
  save(); renderAll();
});
$('#clearAll').addEventListener('click', () => {
  if (!confirm('确定清空所有对话吗？此操作无法撤销。')) return;
  store.convs = []; store.active = null; newConv('chat'); store.mode = 'chat';
  $('#dlg').close();
});

/* 启动 */
renderImgControls();
if (store.mode === 'image') { renderAll(); } else {
  if (!cur() || cur().mode !== store.mode) {
    const c = store.convs.find((x) => x.mode === store.mode) || newConv(store.mode);
    store.active = c.id;
  }
  renderAll();
}
</script>
</body>
