name = "bcai-ai-workbench"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Cloudflare Workers AI 原生免费绑定（无需 API Token 即可在 Pages/Workers 内部免费调用）
[ai]
binding = "AI"

# Cloudflare D1 数据库绑定（可选）
# 注意：切勿保留无效的占位 database_id，否则 Pages 部署会校验失败。
# 方式一（推荐）：部署后直接在 Cloudflare Dashboard -> Pages -> Settings -> Functions 中绑定 D1 数据库，变量名填 DB。
# 方式二（Wrangler CLI）：运行 `npx wrangler d1 create bcai-db` 获取真实 UUID 后取消下方注释并填入：
# [[d1_databases]]
# binding = "DB"
# database_name = "bcai-db"
# database_id = "填入你的真实-D1-UUID"

# Cloudflare R2 对象存储桶绑定（可选）
# 部署后可在 Pages Settings -> Functions 绑定 R2 Bucket，变量名填 BUCKET：
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "bcai-storage"

[vars]
DEEPSEEK_BASE_URL = "https://api.deepseek.com/v1"
GROQ_BASE_URL = "https://api.groq.com/openai/v1"
OPENAI_BASE_URL = "https://api.openai.com/v1"
TARGET_REPO_URL = "https://github.com/757926525/bcai"
